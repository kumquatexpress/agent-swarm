:root {
  color-scheme: dark;
  font-family: 'DM Sans', sans-serif;
  color: #f1ece4;
  background: #0a1018;
  --edge: clamp(22px, 3.65vw, 72px);
  --muted: #a7acb2;
  --accent: #ff8c73;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 280px; }
button, select, input { font: inherit; }
button, select { color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, canvas:focus-visible {
  outline: 2px solid #ffb39f;
  outline-offset: 4px;
}
button { -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.viewer {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 370px;
  overflow: hidden;
  background: #0a1018;
}
.stage { position: relative; isolation: isolate; flex: 1 1 0; min-height: 0; overflow: hidden; }
#scene { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#scene:active { cursor: grabbing; }
#scene:focus-visible { outline-offset: -3px; }
.stage-shade {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(4, 8, 15, .32), transparent 27%, transparent 76%, rgba(4, 8, 15, .57));
}
.title-block { position: absolute; top: clamp(24px, 4.4vh, 56px); left: var(--edge); pointer-events: none; }
h1 { margin: 0; font: 400 clamp(58px, 6.5vw, 108px)/.84 'Instrument Serif', Georgia, serif; letter-spacing: -.038em; color: #faf1e3; }
.title-block p { margin: 15px 0 0 2px; font-size: clamp(13px, 1.12vw, 17px); font-weight: 450; color: #c5c8ca; letter-spacing: .005em; }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.6; flex: none; }
.icon-button { display: grid; place-items: center; padding: 0; border-radius: 50%; }
.expand { position: absolute; top: clamp(24px, 4.4vh, 56px); right: var(--edge); width: 46px; height: 46px; color: #e8e9e7; background: rgba(11, 18, 27, .55); border: 1px solid rgba(200, 212, 220, .32); backdrop-filter: blur(12px); transition: background .18s, border-color .18s; }
.expand:hover { background: #26313c; border-color: #98a5af; }
.expand .icon { width: 19px; height: 19px; }
.scene-tools { position: absolute; bottom: clamp(19px, 3.2vh, 40px); left: var(--edge); right: var(--edge); display: flex; align-items: center; justify-content: space-between; gap: 15px; pointer-events: none; }
.gesture-hint { display: flex; gap: 10px; align-items: center; color: #c0c7ce; font-size: 13px; font-weight: 450; text-shadow: 0 1px 12px #080d16; }
.orbit-icon { width: 24px; height: 24px; color: #c4cdd5; stroke-width: 1.25; }
.hint-dot { margin: 0 3px; color: #8995a1; }
.touch-hint { display: none; }
.views { display: inline-flex; align-items: stretch; gap: 2px; padding: 4px; pointer-events: auto; background: rgba(12, 19, 27, .78); border: 1px solid rgba(188, 204, 216, .27); border-radius: 30px; backdrop-filter: blur(14px); }
.view { border: 1px solid transparent; border-radius: 24px; background: transparent; padding: 9px 16px; line-height: 1.1; color: #c5cbd1; white-space: nowrap; font-weight: 550; font-size: 13px; transition: color .2s, background .2s; }
.view:hover { color: #fff; background: #26313b; }
.view.active { color: #171a1d; background: #eae4d9; }
.scene-status { position: absolute; z-index: 2; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 12px 17px; border-radius: 6px; background: #111b26; color: #e3e5e5; font-size: 14px; text-align: center; }
.transport { position: relative; display: flex; align-items: center; gap: clamp(14px, 1.9vw, 32px); flex: none; min-height: 90px; padding: 12px var(--edge) max(12px, env(safe-area-inset-bottom)); border-top: 1px solid #323942; background: #0c1118; }
.play { width: 46px; height: 46px; flex: 0 0 46px; border: none; background: #ff987e; color: #261813; transition: background .18s, transform .18s; }
.play:hover { background: #ffb39f; transform: scale(1.05); }
.play .icon { width: 22px; height: 22px; stroke-width: 3; }
.play.is-paused .icon { stroke-width: 1.5; fill: currentColor; }
.timecode { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 560; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: .01em; }
.duration, .time-separator { color: var(--muted); font-weight: 400; }
.scrubber { display: flex; align-items: center; flex: 1 1 auto; min-width: 20px; }
#timeline { --progress: 0%; width: 100%; height: 36px; padding: 0; margin: 0; cursor: pointer; appearance: none; -webkit-appearance: none; background: transparent; border: 0; }
#timeline::-webkit-slider-runnable-track { height: 4px; border-radius: 9px; background: linear-gradient(to right, var(--accent) var(--progress), #404752 var(--progress)); }
#timeline::-moz-range-track { height: 4px; border-radius: 9px; background: #404752; }
#timeline::-moz-range-progress { height: 4px; background: var(--accent); border-radius: 9px; }
#timeline::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: #ffd1bb; border: none; }
#timeline::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #ffd1bb; border: none; }
.speed { display: flex; align-items: center; gap: 7px; padding-left: clamp(12px, 1.8vw, 30px); border-left: 1px solid #333b45; font-size: 13px; }
.speed-label { color: var(--muted); }
.select-wrap { position: relative; display: inline-flex; align-items: center; }
.select-wrap .icon { width: 14px; height: 14px; position: absolute; right: 3px; pointer-events: none; }
.speed select { appearance: none; border: none; cursor: pointer; background: transparent; padding: 9px 19px 9px 3px; font-weight: 600; line-height: 1.1; text-align: right; }
.speed option { background: #19212a; color: #f1ece4; }
@media (pointer: coarse) {
  .pointer-hint { display: none; }
  .touch-hint { display: inline; }
}
@media (max-width: 690px) {
  .viewer { min-height: 420px; }
  .title-block { top: 26px; }
  h1 { font-size: clamp(50px, 12vw, 76px); }
  .title-block p { font-size: 13px; margin-top: 10px; }
  .expand { top: 25px; width: 39px; height: 39px; }
  .scene-tools { flex-direction: column; align-items: center; gap: 12px; bottom: 16px; }
  .gesture-hint { font-size: 11px; gap: 6px; }
  .gesture-hint .icon { width: 17px; height: 17px; }
  .view { padding: 8px 14px; }
  .transport { min-height: 82px; gap: 10px; flex-wrap: wrap; padding: 6px var(--edge) max(9px, env(safe-area-inset-bottom)); }
  .play { width: 34px; height: 34px; flex-basis: 34px; }
  .play .icon { width: 17px; height: 17px; }
  .timecode { gap: 5px; font-size: 12px; }
  .scrubber { flex: 0 0 100%; order: -1; height: 17px; margin-bottom: -4px; }
  #timeline { height: 26px; }
  .speed { margin-left: auto; border: 0; padding: 0; }
}
@media (max-height: 540px) and (min-width: 691px) {
  .viewer { min-height: 300px; }
  .title-block, .expand { top: 15px; }
  h1 { font-size: 49px; }
  .title-block p { margin-top: 6px; font-size: 12px; }
  .scene-tools { bottom: 8px; }
  .transport { min-height: 59px; padding-top: 5px; padding-bottom: 5px; }
  .play { width: 37px; height: 37px; flex-basis: 37px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }

@media (min-width: 691px) {
  .workspace-host .transport { padding-right: max(var(--edge), 200px); }
}
@media (max-width: 690px) {
  .workspace-host .transport { padding-bottom: max(51px, env(safe-area-inset-bottom)); }
}

.viewer.immersive .stage { flex: 1; }
.viewer.immersive .transport { position: absolute; bottom: 0; left: 0; right: 0; }
.viewer.immersive .scene-tools { bottom: 108px; }
.viewer.immersive :is(.title-block, .expand, .scene-tools, .transport, .stage-shade) { transition: opacity .25s; }
.viewer.immersive.quiet :is(.title-block, .expand, .scene-tools, .transport, .stage-shade) { opacity: 0; pointer-events: none; }
.viewer.immersive.quiet .views { pointer-events: none; }
.viewer.immersive.quiet #scene { cursor: none; }
@media (max-width: 690px) {
  .workspace-host .viewer.immersive .scene-tools { bottom: 140px; }
}

  <script type="module">
import { THREE, OrbitControls, EffectComposer, RenderPass, UnrealBloomPass, OutputPass } from './engine.js';

// environment.js
const skyVertex = `
  varying vec3 vDirection;
  void main() {
    vDirection = position;
    vec4 clip = projectionMatrix * vec4(mat3(viewMatrix) * position, 1.0);
    gl_Position = clip.xyww;
  }
`;

const skyFragment = `
  uniform sampler2D uSky;
  varying vec3 vDirection;
  void main() {
    vec3 dir = normalize(vDirection);
    vec2 uv = vec2(atan(dir.x, -dir.z) / 6.28318530718 + 0.5,
                   asin(clamp(dir.y, -1.0, 1.0)) / 3.14159265359 + 0.5);
    gl_FragColor = texture2D(uSky, uv);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }
`;

// Bake the distant smoke once. Sampling the field in 3D keeps it continuous
// through the poles and across the panorama's seam.
const atmosphereFragment = `
  varying vec2 vUv;

  float hash(vec3 p) {
    p = fract(p * 0.1031);
    p += dot(p, p.yzx + 33.33);
    return fract((p.x + p.y) * p.z);
  }

  float noise3(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float lo = mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x),
                   mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y);
    float hi = mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                   mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y);
    return mix(lo, hi, f.z);
  }

  float turbulence(vec3 p) {
    mat3 rotateField = mat3(0.0, 0.8, 0.6, -0.8, 0.36, -0.48, -0.6, -0.48, 0.64);
    float sum = 0.0;
    float amplitude = 0.52;
    for (int i = 0; i < 5; i++) {
      sum += amplitude * noise3(p);
      p = rotateField * p * 2.08 + vec3(5.3, 8.1, 2.7);
      amplitude *= 0.48;
    }
    return sum;
  }

  void main() {
    float longitude = (vUv.x - 0.5) * 6.28318530718;
    float latitude = (vUv.y - 0.5) * 3.14159265359;
    vec3 dir = vec3(cos(latitude) * sin(longitude), sin(latitude),
                    -cos(latitude) * cos(longitude));

    float bend = turbulence(dir * 2.7 + vec3(8.7, 2.3, 5.6)) - 0.5;
    float broad = turbulence(dir * 5.2 + vec3(2.4, 5.8, 1.7));
    vec3 field = dir * vec3(10.0, 14.0, 9.0) + vec3(3.0, 5.0, 7.0) + bend * 2.5;
    float detail = turbulence(field);

    // Long, broken shelves of cold vapor, banked away from the subject.
    float height = dir.y - 0.22 * dir.x + 0.19 * dir.z + bend * 0.42;
    float bank = exp(-22.0 * (height + 0.14) * (height + 0.14));
    float upper = exp(-56.0 * (height - 0.29) * (height - 0.29));
    float body = smoothstep(0.29, 0.74, detail * 0.59 + broad * 0.41);
    float folds = pow(max(0.0, 1.0 - abs(detail - 0.53) * 5.3), 3.0);
    float vapor = (bank + upper * 0.35) * (body * 0.8 + folds * body * 0.25);
    float sideLight = 0.64 + 0.36 * max(0.0, dot(dir, normalize(vec3(-0.8, 0.12, -0.6))));
    vec3 color = vec3(0.006, 0.009, 0.018);
    color += vec3(0.004, 0.009, 0.016) * broad;
    color += vec3(0.014, 0.040, 0.060) * vapor * sideLight;
    color += vec3(0.005, 0.010, 0.031) * upper * body;
    gl_FragColor = vec4(color, 1.0);
  }
`;

function makeSky(THREE, renderer, scene) {
  const textureTarget = new THREE.WebGLRenderTarget(1280, 640, {
    type: THREE.HalfFloatType,
    depthBuffer: false,
    stencilBuffer: false,
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    wrapS: THREE.RepeatWrapping,
  });
  const bakeScene = new THREE.Scene();
  const bakeCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const bakeMaterial = new THREE.ShaderMaterial({
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `,
    fragmentShader: atmosphereFragment,
    depthTest: false,
    depthWrite: false,
  });
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bakeMaterial);
  bakeScene.add(quad);
  const previousTarget = renderer.getRenderTarget();
  renderer.setRenderTarget(textureTarget);
  renderer.render(bakeScene, bakeCamera);
  renderer.setRenderTarget(previousTarget);
  quad.geometry.dispose();
  bakeMaterial.dispose();

  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 32),
    new THREE.ShaderMaterial({
      uniforms: { uSky: { value: textureTarget.texture } },
      vertexShader: skyVertex,
      fragmentShader: skyFragment,
      side: THREE.BackSide,
      depthTest: false,
      depthWrite: false,
    }),
  );
  sky.renderOrder = -1000;
  sky.frustumCulled = false;
  scene.add(sky);
}

function makeLights(THREE, scene, renderer) {
  const studio = new THREE.Scene();
  studio.background = new THREE.Color().setRGB(0.13, 0.16, 0.21);
  const panels = [];
  function panel(position, width, height, color) {
    const material = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setRGB(...color),
      side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, height), material);
    mesh.position.set(...position);
    mesh.lookAt(0, 0, 0);
    studio.add(mesh);
    panels.push(mesh);
  }
  panel([-5, 7, 6], 9, 5, [4.2, 3.7, 3.15]);
  panel([6, 1, 3], 2.5, 8, [1.4, 2.1, 2.8]);
  panel([-6, 0, -4], 1.5, 8, [1.7, 2.55, 3.6]);
  panel([2, 5, -5], 7, 2.0, [1.8, 2.8, 4.0]);
  panel([0, -6, 2], 6, 3, [0.65, 0.48, 0.37]);

  const generator = new THREE.PMREMGenerator(renderer);
  const environment = generator.fromScene(studio, 0.025);
  scene.environment = environment.texture;
  scene.environmentIntensity = 0.58;
  generator.dispose();
  for (const mesh of panels) {
    mesh.geometry.dispose();
    mesh.material.dispose();
  }

  function directional(color, intensity, position) {
    const lamp = new THREE.DirectionalLight(color, intensity);
    lamp.position.set(...position);
    scene.add(lamp);
    return lamp;
  }
  const key = directional(0xffead3, 1.50, [-7, 8, 8]);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  Object.assign(key.shadow.camera, {
    left: -4.6,
    right: 4.6,
    top: 4.6,
    bottom: -4.6,
    near: 8,
    far: 19,
  });
  key.shadow.camera.updateProjectionMatrix();
  key.shadow.bias = -0.00018;
  key.shadow.normalBias = 0.004;
  key.shadow.radius = 2.2;
  directional(0xc5e6ff, 0.32, [7, 2, 7]);
  directional(0xa0d8ff, 1.25, [3, 6, -6]);
  directional(0xffc69d, 0.14, [-2, -5, 2]);
  scene.add(new THREE.HemisphereLight(0xc8dfff, 0x72615b, 0.1));
  const reflectedGold = new THREE.PointLight(0xffb961, 14, 20, 2);
  scene.add(reflectedGold);
}

function makeHalo(THREE, scene) {
  const material = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorld = world.xyz;
        gl_Position = projectionMatrix * viewMatrix * world;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      varying vec3 vWorld;
      void main() {
        vec3 ray = normalize(vWorld - cameraPosition);
        float t = max(0.0, dot(-cameraPosition, ray));
        vec3 nearest = cameraPosition + ray * t;
        float distanceSquared = dot(nearest, nearest);
        float edge = 1.0 - smoothstep(16.0, 54.0, distanceSquared);
        float density = exp(-0.095 * distanceSquared) * edge;
        float pulse = 0.95 + 0.05 * sin(uTime * 0.5235987756);
        gl_FragColor = vec4(vec3(0.115, 0.044, 0.011) * density * pulse, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
    side: THREE.BackSide,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const halo = new THREE.Mesh(new THREE.SphereGeometry(7.5, 48, 32), material);
  halo.renderOrder = -20;
  scene.add(halo);
  return material;
}

function makeDust(THREE, scene) {
  const count = 680;
  const positions = new Float32Array(count * 3);
  const attributes = new Float32Array(count * 3);
  let seed = 834279;
  function random() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  for (let i = 0; i < count; i++) {
    const index = i * 3;
    positions[index] = (random() - 0.5) * 55;
    positions[index + 1] = (random() - 0.5) * 32;
    positions[index + 2] = (random() - 0.5) * 48;
    attributes[index] = random();
    attributes[index + 1] = random();
    attributes[index + 2] = random();
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aDust', new THREE.BufferAttribute(attributes, 3));
  const material = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uRatio: { value: 1 } },
    vertexShader: `
      uniform float uTime;
      uniform float uRatio;
      attribute vec3 aDust;
      varying float vAlpha;
      varying float vWarm;
      void main() {

const BASE_PERIOD = 18;
const TRACK_SAMPLES = 256;
const TRAIL_STEPS = 25;

function smoothUnit(value) {

function positiveModulo(value, divisor) {

function createSwarm(THREE, scene) {

  const up = new THREE.Vector3(0, 1, 0);
  const forwardAxis = new THREE.Vector3(1, 0, 0);

  const localUp = new THREE.Vector3();

  const nose = new THREE.Vector3();

  const bankRotation = new THREE.Quaternion();

    const t = Math.max(0, Math.min(1, age / flight.duration));

    curve.getPoint(t, nose);
    const a = (1 - t) * (1 - t);
    const b = 2 * (1 - t) * t;

      a * (curve.v1.x - curve.v0.x) + b * (curve.v2.x - curve.v1.x) + c * (curve.v3.x - curve.v2.x),
      a * (curve.v1.y - curve.v0.y) + b * (curve.v2.y - curve.v1.y) + c * (curve.v3.y - curve.v2.y),
      a * (curve.v1.z - curve.v0.z) + b * (curve.v2.z - curve.v1.z) + c * (curve.v3.z - curve.v2.z)
    ).normalize();
    side.crossVectors(forward, up).normalize();
    localUp.crossVectors(side, forward);
    orientation.makeBasis(forward, localUp, side);
    body.quaternion.setFromRotationMatrix(orientation);
    const bank = flight.bank + 0.23 * Math.sin(t * Math.PI * 2.2 + flight.rollPhase);
    bankRotation.setFromAxisAngle(forwardAxis, bank * Math.sign(forward.x));
    body.quaternion.multiply(bankRotation);

    const reveal = smoothUnit(age / 0.48);
    const collapse = smoothUnit((flight.duration - age) / 0.35);

    body.scale.setScalar(scale);

  function addFlight(formation, phase, heroScale = 0, period = formation.period || BASE_PERIOD) {

    const laneY = signed();
    const laneZ = signed();
    const impactY = signed();
    const impactZ = signed();
    start.y += laneY * ySpread * 1.4;
    start.z += laneZ * zSpread * 1.4;
    first.y += (laneY + signed() * 0.4) * ySpread;
    first.z += (laneZ + signed() * 0.4) * zSpread;
    second.y += (laneY * 0.6 + impactY * 0.5) * ySpread;
    second.z += (laneZ * 0.6 + impactZ * 0.5) * zSpread;
    end.y += impactY * 0.34;
    end.z += impactZ * 0.38;

      size,
      period,
      phase: phase * period / BASE_PERIOD,
      duration: (14.25 + random() * 0.95) * period / BASE_PERIOD,
      bank: 0.48 + random() * 0.53,
      rollPhase: random() * Math.PI * 2,

      sides[vertex] = -1;

  const dynamicAttribute = (array, length) => new THREE.BufferAttribute(array, length).setUsage(THREE.DynamicDrawUsage);

  trails.setAttribute('pathTangent', dynamicAttribute(tangents, 3));
  trails.setAttribute('trailSide', new THREE.BufferAttribute(sides, 1));

    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute vec3 pathTangent;

      attribute float trailWidth;

      const sampleAge = age - distance * flight.trailDuration;
      const progress = Math.max(0, Math.min(1, sampleAge / flight.duration));
      const location = progress * TRACK_SAMPLES;

  }

  function update(time) {

    let visibleCraft = 0;
    let visibleTracks = 0;
    for (const flight of flights) {
      const age = positiveModulo(time + flight.phase, flight.period);
      if (age < flight.duration) {
        pose(flight, age);
        for (const mesh of craftMeshes) {
          mesh.setMatrixAt(visibleCraft, body.matrix);
        }
        visibleCraft++;
      }
      if (age < flight.duration + flight.trailDuration) {
        for (const points of flight.tracks) {
          writeTrack(flight, points, age, visibleTracks++);
        }
      }
      const impactAge = age - flight.duration;
      if (impactAge >= 0 && impactAge <= 1.5) {
        impacts.push({ position: flight.curve.v3, age: impactAge, strength: flight.strength });
      }
    }
    for (const mesh of craftMeshes) {
      mesh.count = visibleCraft;
      mesh.instanceMatrix.needsUpdate = true;
    }
    trails.setDrawRange(0, visibleTracks * (TRAIL_STEPS - 1) * 6);
    for (const key of ['position', 'pathTangent', 'trailWidth', 'trailWeight']) {
      trails.attributes[key].needsUpdate = true;
    }
    return impacts;
  }

  update(0);
  return { update };
}
function makeCraftParts(THREE) {

    titanium: new THREE.MeshStandardMaterial({ color: 0x9dabb8, metalness: 0.66, roughness: 0.33 }),
    edge: new THREE.MeshStandardMaterial({ color: 0xe7e5df, metalness: 0.62, roughness: 0.24 }),
    slate: new THREE.MeshStandardMaterial({ color: 0x526372, metalness: 0.68, roughness: 0.38 }),
    graphite: new THREE.MeshStandardMaterial({ color: 0x26313c, metalness: 0.66, roughness: 0.37 }),
    glass: new THREE.MeshStandardMaterial({ color: 0x131f30, metalness: 0.61, roughness: 0.15 }),
    coral: new THREE.MeshBasicMaterial({ color: new THREE.Color(2.3, 0.13, 0.05) }),
    hot: new THREE.MeshBasicMaterial({ color: new THREE.Color(3.1, 1.12, 0.40) })
  };
  const positions = Object.fromEntries(Object.keys(materials).map(name => [name, []]));

  function triangle(material, a, b, c, outward) {
    const ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
    const ac = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
    const normal = [
      ab[1] * ac[2] - ab[2] * ac[1],
      ab[2] * ac[0] - ab[0] * ac[2],
      ab[0] * ac[1] - ab[1] * ac[0]
    ];
    const flipped = normal[0] * outward[0] + normal[1] * outward[1] + normal[2] * outward[2] < 0;
    positions[material].push(...a, ...(flipped ? c : b), ...(flipped ? b : c));
  }

    for (let i = 1; i < vertices.length - 1; i++) {
      triangle(material, vertices[0], vertices[i], vertices[i + 1], outward);
    }

  const hullSections = [
    [-0.43, 0.072, 0.056, 0.047],
    [-0.25, 0.126, 0.092, 0.064],
    [0.07, 0.116, 0.107, 0.065],
    [0.28, 0.078, 0.064, 0.045],
    [0.55, 0.003, 0.005, 0.003]
  ];
  const hull = hullSections.map(([x, width, top, bottom]) => [
    [x, top, 0], [x, top * 0.63, width * 0.73], [x, 0.006, width],
    [x, -bottom * 0.59, width * 0.77], [x, -bottom, 0],
    [x, -bottom * 0.59, -width * 0.77], [x, 0.006, -width], [x, top * 0.63, -width * 0.73]
  ]);
  for (let i = 1; i < hull.length; i++) {

    const front = hull[i];
    for (let j = 0; j < rear.length; j++) {
      const next = (j + 1) % rear.length;
      const material = j === 0 || j === 7 ? 'graphite' : j === 1 || j === 6 ? 'titanium' : 'slate';
      face(material, [rear[j], front[j], front[next], rear[next]], [0, rear[j][1] + rear[next][1], rear[j][2] + rear[next][2]]);
    }

  face('edge', hull[hull.length - 1], [1, 0, 0]);

  // Raised sensor glass has a sharp diamond highlight along its center ridge.
  const canopy = {
    nose: [0.32, 0.057, 0], peak: [0.068, 0.132, 0], tail: [-0.15, 0.103, 0]
  };
  for (const side of [-1, 1]) {
    const outer = [0.055, 0.082, 0.067 * side];
    triangle('glass', canopy.nose, canopy.peak, outer, [0, 1, side]);
    triangle('glass', canopy.peak, canopy.tail, outer, [0, 1, side]);
    triangle('slate', canopy.nose, outer, [0.08, 0.063, 0.084 * side], [0, 1, side]);
    triangle('slate', canopy.tail, [0.08, 0.063, 0.084 * side], outer, [0, 1, side]);
  }

  // The two cranked wings carry continuous leading edges and a serrated rear.
  for (const side of [-1, 1]) {
    const mirror = ([x, y, z]) => [x, y, z * side];
    const upper = [
      [0.33, 0.026, 0.052], [0.017, 0.046, 0.281], [-0.29, 0.014, 0.495],
      [-0.405, -0.009, 0.452], [-0.31, 0.008, 0.358], [-0.421, 0.012, 0.278],
      [-0.33, 0.022, 0.087]

      triangle('graphite', keel, lower[i], lower[next], [0, -1, 0]);
      const dx = upper[next][0] - upper[i][0];
      const dz = upper[next][2] - upper[i][2];
      face(i < 2 ? 'edge' : 'graphite', [upper[i], lower[i], lower[next], upper[next]], [dz * side, 0, -dx * side]);
    }

    // A narrow, raised control surface catches a second set of reflections.
    const flap = [
      [-0.112, 0.068, 0.237], [-0.27, 0.039, 0.365], [-0.325, 0.028, 0.344],
      [-0.233, 0.046, 0.252]
    ].map(mirror);
    face('slate', flap, [0, 1, 0]);
    face('coral', [
      [-0.223, 0.051, 0.271], [-0.29, 0.036, 0.331], [-0.3, 0.035, 0.327],
      [-0.237, 0.049, 0.271]
    ].map(mirror), [0, 1, 0]);

    // Canted split fins preserve the silhouette at a shallow viewing angle.
    const finFront = mirror([-0.105, 0.068, 0.071]);
    const finRear = mirror([-0.415, 0.045, 0.068]);
    const finTip = mirror([-0.365, 0.179, 0.134]);
    const finRidge = mirror([-0.275, 0.082, 0.102]);
    triangle('slate', finFront, finRidge, finTip, [0, 0, side]);
    triangle('titanium', finRidge, finRear, finTip, [0, 0, side]);
    triangle('graphite', finFront, finRear, finTip, [0, 0, -side]);

    // Octagonal engine nacelles expose a textured metal collar and glowing core.
    const z = 0.115 * side;
    function ring(x, radius) {
      return Array.from({ length: 8 }, (_, i) => {
        const angle = Math.PI * (i + 0.5) / 4;
        return [x, Math.cos(angle) * radius, z + Math.sin(angle) * radius];
      });
    }
    const sections = [
      [-0.22, 0.036], [-0.30, 0.053], [-0.42, 0.056], [-0.448, 0.052],
      [-0.459, 0.053], [-0.505, 0.047], [-0.523, 0.038]
    ].map(([x, radius]) => ring(x, radius));
    const bands = ['slate', 'graphite', 'titanium', 'coral', 'graphite', 'edge'];
    for (let i = 1; i < sections.length; i++) {
      const a = sections[i - 1];
      const b = sections[i];
      for (let j = 0; j < a.length; j++) {
        const next = (j + 1) % a.length;
        face(bands[i - 1], [a[j], a[next], b[next], b[j]], [0, a[j][1] + a[next][1], a[j][2] + a[next][2] - 2 * z]);
      }
    }
    face('graphite', sections[0], [1, 0, 0]);
    face('coral', sections[sections.length - 1], [-1, 0, 0]);
    const flameBase = ring(-0.524, 0.028);
    const flameTip = [-0.59, 0, z];
    for (let j = 0; j < flameBase.length; j++) {
      const next = (j + 1) % flameBase.length;
      triangle('hot', flameBase[j], flameBase[next], flameTip, [-0.02, flameBase[j][1] + flameBase[next][1], flameBase[j][2] + flameBase[next][2] - 2 * z]);
    }
  }

  return Object.entries(materials).map(([name, material]) => {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions[name], 3));
    geometry.computeVertexNormals();
    geometry.computeBoundingSphere();
    return { geometry, material };
  });
}

  // shadow map to cast from the key light; the light's bias handles self-shadow.
  for (const material of [ink, cheek, tongue]) material.shadowSide = THREE.DoubleSide;
  const head = new THREE.Mesh(new THREE.SphereGeometry(radius, 96, 72), gold);
  sculpture.add(head);

  // Concentric rings conform every facial feature to the spherical surface.
  // A shallow dome and rounded margins give the enamel inlays physical depth.
  function inlay(shape, center, material, height, base = 0.011) {
    const contour = shape.getPoints(14);
    if (contour[0].distanceToSquared(contour[contour.length - 1]) < 1e-10) contour.pop();
    const positions = [];
    const indices = [];
    function put(x, y, relief) {
      const z = Math.sqrt(Math.max(0.01, radius * radius - x * x - y * y));
      const scale = 1 + relief / radius;
      positions.push(x * scale, y * scale, z * scale);
    }
    const profile = [
      [0.18, 1], [0.38, 0.98], [0.58, 0.95], [0.76, 0.87],
      [0.88, 0.74], [0.95, 0.54], [0.988, 0.31], [1, 0],
    ];
    put(center[0], center[1], base + height);
    for (let r = 0; r < profile.length; r++) {
      const [fraction, dome] = profile[r];
      for (let i = 0; i < contour.length; i++) {
        const p = contour[i];
        put(center[0] + (p.x - center[0]) * fraction,
          center[1] + (p.y - center[1]) * fraction, base + height * dome);
        const next = (i + 1) % contour.length;
        const a = 1 + r * contour.length + i;
        const b = 1 + r * contour.length + next;
        if (r === 0) indices.push(0, a, b);
        else {
          const prevA = a - contour.length;
          const prevB = b - contour.length;
          indices.push(prevA, a, b, prevA, b, prevB);
        }
      }
    }
    // Reverse the winding for a clockwise source contour.
    let signedArea = 0;
    for (let i = 0; i < contour.length; i++) {
      const p = contour[i];
      const q = contour[(i + 1) % contour.length];
      signedArea += p.x * q.y - q.x * p.y;
    }
    if (signedArea < 0) {
      for (let i = 0; i < indices.length; i += 3) {
        [indices[i + 1], indices[i + 2]] = [indices[i + 2], indices[i + 1]];
      }
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    sculpture.add(new THREE.Mesh(geometry, material));
  }

  for (const side of [-1, 1]) {
    const eyeX = side * 0.75;
    const eyeY = 0.7;
    const eye = new THREE.Shape();
    const x = (v) => eyeX + side * v;
    const y = (v) => eyeY + v;
    eye.moveTo(x(-0.065), y(-0.145));
    eye.bezierCurveTo(x(0.025), y(-0.115), x(0.095), y(-0.315), x(0.17), y(-0.255));
    eye.bezierCurveTo(x(0.325), y(-0.17), x(0.36), y(0.025), x(0.26), y(0.16));
    eye.bezierCurveTo(x(0.15), y(0.325), x(-0.07), y(0.35), x(-0.215), y(0.23));
    eye.bezierCurveTo(x(-0.325), y(0.14), x(-0.335), y(-0.025), x(-0.258), y(-0.15));
    eye.bezierCurveTo(x(-0.22), y(-0.23), x(-0.14), y(-0.17), x(-0.065), y(-0.145));
    inlay(eye, [eyeX, eyeY + 0.02], ink, 0.073);

    const cheekX = side * 1.34;
    const cheekY = 0.46;
    const circle = new THREE.Shape();
    circle.absellipse(cheekX, cheekY, 0.177, 0.179, 0, Math.PI * 2, false, 0);
    inlay(circle, [cheekX, cheekY], cheek, 0.026);
  }

  const mouth = new THREE.Shape();
  mouth.moveTo(-0.755, -0.074);
  mouth.bezierCurveTo(-0.755, 0.093, -0.59, -0.014, -0.445, -0.076);
  mouth.bezierCurveTo(-0.285, -0.156, -0.145, -0.21, 0, -0.21);
  mouth.bezierCurveTo(0.145, -0.21, 0.285, -0.156, 0.445, -0.076);
  mouth.bezierCurveTo(0.59, -0.014, 0.755, 0.093, 0.755, -0.074);
  mouth.bezierCurveTo(0.755, -0.437, 0.525, -0.843, 0, -0.843);
  mouth.bezierCurveTo(-0.525, -0.843, -0.755, -0.437, -0.755, -0.074);
  inlay(mouth, [0, -0.43], ink, 0.04);

  const smile = new THREE.Shape();
  smile.moveTo(-0.428, -0.698);
  smile.bezierCurveTo(-0.375, -0.58, -0.265, -0.495, -0.15, -0.468);
  smile.bezierCurveTo(-0.1, -0.453, -0.061, -0.593, 0, -0.593);
  smile.bezierCurveTo(0.055, -0.593, 0.107, -0.453, 0.155, -0.472);
  smile.bezierCurveTo(0.275, -0.51, 0.37, -0.59, 0.425, -0.698);
  smile.bezierCurveTo(0.315, -0.788, 0.165, -0.831, 0, -0.831);
  smile.bezierCurveTo(-0.165, -0.831, -0.315, -0.788, -0.428, -0.698);
  inlay(smile, [0, -0.695], tongue, 0.021, 0.054);

  // Union tapered finger bones with an ellipsoidal palm, then mesh the implicit
  // surface. Fingers and palm become a single, smoothly sculpted solid.
  function makeHand() {
    function point(u, v, offset = 0) {
      const x = (u - 47.21) * 0.053;
      const y = (41.75 - v) * 0.053;
      return { x, y, z: 1.75 + 0.24 * (x + 1.1) + 0.27 * (y + 1.5) + offset };
    }
    const bones = [];
    function finger(coords) {
      for (let i = 1; i < coords.length; i++) {
        const a = coords[i - 1];
        const b = coords[i];
        const start = point(a[0], a[1], a[3]);
        const end = point(b[0], b[1], b[3]);
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const dz = end.z - start.z;
        bones.push({ ...start, dx, dy, dz, lengthSq: dx * dx + dy * dy + dz * dz,
          r: a[2], dr: b[2] - a[2] });
      }
    }
    finger([[31, 71, 0.235, -0.15], [34, 68, 0.20, -0.09], [31.6, 63, 0.149, 0.01],
      [28.6, 59.1, 0.129, 0.045], [28.65, 55.8, 0.118, 0.01]]);
    finger([[28.1, 68.7, 0.165], [24, 63.5, 0.126, 0.025], [21, 58.3, 0.114, 0.04],
      [17.8, 53.65, 0.113, -0.025]]);
    finger([[26.5, 71.2, 0.16], [21.1, 67.3, 0.129, 0.02], [15, 62.5, 0.116, 0.035],
      [10.65, 58.8, 0.112, -0.018]]);
    finger([[25.1, 74.3, 0.146], [20.1, 72.0, 0.12, 0.02], [13.7, 68.5, 0.108, 0.025],
      [9.4, 66.4, 0.102, -0.022]]);
    finger([[25.4, 76.6, 0.135], [20.1, 76.6, 0.115, 0.01], [14.3, 74.6, 0.091, 0.015],
      [9.5, 72.5, 0.088, -0.025]]);
    // The wrist turns back into the head, hidden behind the palm from the front.
    finger([[31.3, 71.6, 0.27, -0.04], [32.9, 69.8, 0.24, -0.29], [34.0, 68.0, 0.20, -0.52]]);
    const palm = point(28.6, 71.9);
    const cosine = Math.cos(0.32);
    const sine = Math.sin(0.32);
    function field(x, y, z) {
      const px = x - palm.x;
      const py = y - palm.y;
      const pz = z - palm.z - 0.18 * px - 0.14 * py;
      const ex = cosine * px + sine * py;
      const ey = -sine * px + cosine * py;
      const ax = 0.548, ay = 0.355, az = 0.235;
      const k0 = Math.sqrt((ex / ax) ** 2 + (ey / ay) ** 2 + (pz / az) ** 2);
      const k1 = Math.sqrt((ex / (ax * ax)) ** 2 + (ey / (ay * ay)) ** 2 + (pz / (az * az)) ** 2);
      let distance = k0 * (k0 - 1) / Math.max(0.000001, k1);
      for (let i = 0; i < bones.length; i++) {
        const b = bones[i];
        const bx = x - b.x, by = y - b.y, bz = z - b.z;
        const t = Math.min(1, Math.max(0, (bx * b.dx + by * b.dy + bz * b.dz) / b.lengthSq));
        const cx = bx - t * b.dx, cy = by - t * b.dy, cz = bz - t * b.dz;
        const d = Math.sqrt(cx * cx + cy * cy + cz * cz) - b.r - t * b.dr;
        const h = Math.max(0, 0.082 - Math.abs(distance - d));
        distance = Math.min(distance, d) - h * h / 0.328;
      }
      return distance;
    }
    const step = 0.038;
    const minX = -2.35, minY = -2.3, minZ = 0.92;
    const nx = 62, ny = 54, nz = 36;
    const plane = nx * ny;
    const values = new Float32Array(plane * nz);
    for (let z = 0; z < nz; z++) {
      for (let y = 0; y < ny; y++) {
        for (let x = 0; x < nx; x++) {
          values[x + nx * y + plane * z] = field(minX + x * step, minY + y * step, minZ + z * step);
        }
      }
    }
    const positions = [], normals = [], colors = [], triangles = [];
    const edges = new Map();
    function vertex(a, b) {
      const low = Math.min(a, b), high = Math.max(a, b);
      const key = low * values.length + high;
      if (edges.has(key)) return edges.get(key);
      const t = values[a] / (values[a] - values[b]);
      const ax = a % nx, bx = b % nx;
      const ay = Math.floor(a / nx) % ny, by = Math.floor(b / nx) % ny;
      const az = Math.floor(a / plane), bz = Math.floor(b / plane);
      const x = minX + (ax + (bx - ax) * t) * step;
      const y = minY + (ay + (by - ay) * t) * step;
      const z = minZ + (az + (bz - az) * t) * step;
      const epsilon = 0.003;
      const dx = field(x + epsilon, y, z) - field(x - epsilon, y, z);
      const dy = field(x, y + epsilon, z) - field(x, y - epsilon, z);
      const dz = field(x, y, z + epsilon) - field(x, y, z - epsilon);
      const length = Math.max(1e-8, Math.hypot(dx, dy, dz));
      const i = positions.length / 3;
      positions.push(x, y, z);
      normals.push(dx / length, dy / length, dz / length);
      const shade = Math.max(0, -dz / length);
      colors.push(1, 1 - 0.22 * shade, 1 - 0.42 * shade);
      edges.set(key, i);
      return i;
    }
    function triangle(i, j, k) {
      const a = i * 3, b = j * 3, c = k * 3;
      const ux = positions[b] - positions[a], uy = positions[b + 1] - positions[a + 1];
      const uz = positions[b + 2] - positions[a + 2];
      const vx = positions[c] - positions[a], vy = positions[c + 1] - positions[a + 1];
      const vz = positions[c + 2] - positions[a + 2];
      const facing = (uy * vz - uz * vy) * normals[a] + (uz * vx - ux * vz) * normals[a + 1]
        + (ux * vy - uy * vx) * normals[a + 2];
      if (facing < 0) triangles.push(i, k, j);
      else triangles.push(i, j, k);
    }
    const tetrahedra = [[0, 1, 2, 6], [0, 2, 3, 6], [0, 3, 7, 6],
      [0, 7, 4, 6], [0, 4, 5, 6], [0, 5, 1, 6]];
    const cornerOffsets = [0, 1, nx + 1, nx, plane, plane + 1, plane + nx + 1, plane + nx];
    for (let z = 0; z < nz - 1; z++) {
      for (let y = 0; y < ny - 1; y++) {
        for (let x = 0; x < nx - 1; x++) {
          const base = x + nx * y + plane * z;
          const inside = values[base] < 0;
          if (cornerOffsets.every((offset) => (values[base + offset] < 0) === inside)) continue;
          for (const tetrahedron of tetrahedra) {
            const ins = [], outs = [];
            for (const corner of tetrahedron) {
              const id = base + cornerOffsets[corner];
              (values[id] < 0 ? ins : outs).push(id);
            }
            if (ins.length === 1 || outs.length === 1) {
              const center = ins.length === 1 ? ins[0] : outs[0];
              const other = ins.length === 1 ? outs : ins;
              triangle(vertex(center, other[0]), vertex(center, other[1]), vertex(center, other[2]));
            } else if (ins.length === 2) {
              const a = vertex(ins[0], outs[0]), b = vertex(ins[0], outs[1]);
              const c = vertex(ins[1], outs[0]), d = vertex(ins[1], outs[1]);
              triangle(a, b, d);
              triangle(a, d, c);
            }
          }
        }
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.setIndex(triangles);
    return geo;
  }
  const handGeometry = makeHand();
  const leftHand = new THREE.Mesh(handGeometry, goldHands);
  const rightHand = new THREE.Mesh(handGeometry, goldHands);
  rightHand.scale.x = -1;
  sculpture.add(leftHand, rightHand);
  for (const mesh of sculpture.children) {
    mesh.castShadow = true;
    mesh.receiveShadow = true;
  }

  const maxHits = 14;
  const hitLocations = Array.from({ length: maxHits }, () => new THREE.Vector3());
  const hitTimes = new Float32Array(maxHits).fill(-1);
  const hitStrengths = new Float32Array(maxHits);
  const uniforms = {
    hitLocations: { value: hitLocations },
    hitTimes: { value: hitTimes },
    hitStrengths: { value: hitStrengths },
  };
  const surfaceVertex = `
    varying vec3 worldSurface;
    void main() {
      vec4 p = modelMatrix * vec4(position, 1.0);
      worldSurface = p.xyz;
      gl_Position = projectionMatrix * viewMatrix * p;
    }
  `;
  const energyFunctions = `
    varying vec3 worldSurface;
    uniform vec3 hitLocations[${maxHits}];
    uniform float hitTimes[${maxHits}];
    uniform float hitStrengths[${maxHits}];
    vec3 energy() {
      float wave = 0.0;
      float heat = 0.0;
      float flash = 0.0;
      for (int i = 0; i < ${maxHits}; i++) {
        float age = hitTimes[i];
        if (age < 0.0 || age > 1.3) continue;
        float d = length(worldSurface - hitLocations[i]);
        float amplitude = (0.33 + 0.67 * hitStrengths[i]) * exp(-3.2 * age);
        float delta = abs(d - (0.04 + 1.55 * age));
        wave += amplitude * exp(-55.0 * delta);
        heat += amplitude * exp(-3.8 * d);
        flash += amplitude * exp(-13.0 * d - 7.0 * age);
      }
      return vec3(wave, heat, flash);
    }
    float rim() {
      vec3 normal = normalize(worldSurface);
      vec3 viewDirection = normalize(cameraPosition - worldSurface);
      return 1.0 - abs(dot(normal, viewDirection));
    }
  `;
  const outputChunks = `
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  `;
  const shellMaterial = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: surfaceVertex,
    fragmentShader: `
      ${energyFunctions}
      void main() {
        vec3 e = energy();
        float edge = pow(clamp(rim(), 0.0, 1.0), 3.5);
        float alpha = 0.002 + 0.23 * edge + 0.59 * e.x + 0.18 * e.y + 0.82 * e.z;
        vec3 color = mix(vec3(0.83, 0.45, 0.15), vec3(2.0, 1.23, 0.53), clamp(e.x + e.z, 0.0, 1.0));
        gl_FragColor = vec4(color, min(alpha, 0.92));
        ${outputChunks}
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  const shell = new THREE.Mesh(new THREE.SphereGeometry(shieldRadius, 96, 64), shellMaterial);
  shell.renderOrder = 2;
  scene.add(shell);

  // Connect the centers of adjoining triangular geodesic faces. The resulting
  // curved hexagon/pentagon seams brighten briefly around each impact.
  function makeSeams() {
    const ico = new THREE.IcosahedronGeometry(1, 2);
    const source = ico.getAttribute('position');
    const edges = new Map();
    const positions = [];
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    const from = new THREE.Vector3(), to = new THREE.Vector3();
    function key(p) {
      return `${Math.round(p.x * 1e5)},${Math.round(p.y * 1e5)},${Math.round(p.z * 1e5)}`;
    }
    for (let i = 0; i < source.count; i += 3) {
      a.fromBufferAttribute(source, i);
      b.fromBufferAttribute(source, i + 1);
      c.fromBufferAttribute(source, i + 2);
      const center = a.clone().add(b).add(c).normalize();
      const ids = [key(a), key(b), key(c)];
      for (let j = 0; j < 3; j++) {
        const pair = [ids[j], ids[(j + 1) % 3]].sort().join('|');
        const neighbor = edges.get(pair);
        if (!neighbor) {
          edges.set(pair, center);
          continue;
        }
        from.copy(neighbor).multiplyScalar(shieldRadius + 0.002);
        for (let step = 1; step <= 5; step++) {
          to.copy(neighbor).lerp(center, step / 5).normalize().multiplyScalar(shieldRadius + 0.002);
          positions.push(from.x, from.y, from.z, to.x, to.y, to.z);
          from.copy(to);
        }
        edges.delete(pair);
      }
    }
    ico.dispose();
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    return geometry;
  }
  const seamMaterial = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: surfaceVertex,
    fragmentShader: `
      ${energyFunctions}
      void main() {
        vec3 e = energy();
        float edge = pow(clamp(rim(), 0.0, 1.0), 1.6);
        float alpha = 0.018 + 0.13 * edge + 1.25 * e.y + 0.45 * e.x;
        gl_FragColor = vec4(1.1, 0.67, 0.31, min(alpha, 0.82));
        ${outputChunks}
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  const seams = new THREE.LineSegments(makeSeams(), seamMaterial);
  seams.renderOrder = 3;
  scene.add(seams);

  const sparksPerHit = 14;
  const sparkCount = maxHits * sparksPerHit;
  const sparkPositions = new Float32Array(sparkCount * 6);
  const sparkEnergy = new Float32Array(sparkCount * 2);
  const sparkGeometry = new THREE.BufferGeometry();
  sparkGeometry.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3).setUsage(THREE.DynamicDrawUsage));
  sparkGeometry.setAttribute('aEnergy', new THREE.BufferAttribute(sparkEnergy, 1).setUsage(THREE.DynamicDrawUsage));
  sparkGeometry.setDrawRange(0, 0);
  const sparkMaterial = new THREE.ShaderMaterial({
    vertexShader: `
      attribute float aEnergy;
      varying float intensity;
      void main() {
        intensity = aEnergy;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying float intensity;
      void main() {
        gl_FragColor = vec4(2.4, 1.1, 0.35, intensity);
        ${outputChunks}
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  const sparks = new THREE.LineSegments(sparkGeometry, sparkMaterial);
  sparks.frustumCulled = false;
  sparks.renderOrder = 4;
  scene.add(sparks);

  const normal = new THREE.Vector3(), tangent = new THREE.Vector3(), bitangent = new THREE.Vector3();
  const direction = new THREE.Vector3(), tmp = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0), right = new THREE.Vector3(1, 0, 0);
  function random(n) {
    const x = Math.sin(n * 93.83) * 43758.5453;
    return x - Math.floor(x);
  }
  function update(time, impactEvents = []) {
    // Tilt slightly as if suspended in the field. The shield stays in world space.
    sculpture.rotation.y = 0.028 * Math.sin(time * Math.PI / 6);
    sculpture.rotation.z = 0.018 * Math.sin(time * 2 * Math.PI / 9);
    let hits = 0;
    let sparkIndex = 0;
    for (const event of impactEvents) {
      if (hits >= maxHits) break;
      if (event.age < 0 || event.age > 1.3) continue;
      hitLocations[hits].copy(event.position);
      hitTimes[hits] = event.age;
      hitStrengths[hits] = event.strength;
      hits++;
      if (event.age > 0.58) continue;
      normal.copy(event.position).normalize();
      tangent.crossVectors(Math.abs(normal.y) < 0.9 ? up : right, normal).normalize();
      bitangent.crossVectors(normal, tangent);
      const seed = event.position.x * 31 + event.position.y * 49 + event.position.z * 17;
      const count = Math.round(6 + 8 * event.strength);
      for (let i = 0; i < count; i++) {
        const angle = 2 * Math.PI * random(seed + i * 3);
        const speed = 0.54 + 1.38 * random(seed + i * 3 + 1);
        direction.copy(tangent).multiplyScalar(Math.cos(angle));
        direction.addScaledVector(bitangent, Math.sin(angle));
        direction.addScaledVector(normal, 0.15 + 0.75 * random(seed + i * 3 + 2)).normalize();
        const end = speed * event.age;
        const start = Math.max(0, end - 0.045 - 0.07 * event.age);
        const offset = sparkIndex * 6;
        tmp.copy(event.position).addScaledVector(direction, start);
        tmp.toArray(sparkPositions, offset);
        tmp.copy(event.position).addScaledVector(direction, end);
        tmp.toArray(sparkPositions, offset + 3);
        const energy = (0.65 + 0.35 * event.strength) * (1 - event.age / 0.58) ** 1.65;
        sparkEnergy[sparkIndex * 2] = energy * 0.12;
        sparkEnergy[sparkIndex * 2 + 1] = energy;
        sparkIndex++;
      }
    }
    hitTimes.fill(-1, hits);
    sparkGeometry.setDrawRange(0, sparkIndex * 2);
    sparkGeometry.attributes.position.needsUpdate = true;
    sparkGeometry.attributes.aEnergy.needsUpdate = true;
  }
  return { update };
}

// main.js

const byId = (id) => document.getElementById(id);
const canvas = byId('scene');
const stage = byId('stage');
const status = byId('scene-status');
const viewer = byId('viewer');
const play = byId('play');
const timeline = byId('timeline');
const speed = byId('speed');
const expand = byId('expand');
const views = [...document.querySelectorAll('[data-view]')];
const duration = 36;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

function setupFullscreen() {
  const supportsFullscreen = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  let windowImmersive = false;
  function inFullscreen() {
    return Boolean(document.fullscreenElement || document.webkitFullscreenElement || windowImmersive);
  }
  let hideTimer;
  function reveal() {
    viewer.classList.remove('quiet');
    window.clearTimeout(hideTimer);
    if (inFullscreen()) {
      hideTimer = window.setTimeout(() => {
        if (!viewer.querySelector(':focus-visible:not(canvas), .transport:hover, .views:hover, .expand:hover')) viewer.classList.add('quiet');
      }, 2600);
    }
  }
  function sync() {
    const active = inFullscreen();
    viewer.classList.toggle('immersive', active);
    reveal();
    const label = windowImmersive || !supportsFullscreen
      ? (active ? 'Exit immersive view' : 'Enter immersive view')
      : (active ? 'Exit full screen' : 'Enter full screen');
    expand.setAttribute('aria-label', label);
    expand.title = label;
    byId('expand-path').setAttribute('d', active
      ? 'M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5'
      : 'M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5');
  }
  expand.addEventListener('click', async () => {
    try {
      if (windowImmersive) {
        windowImmersive = false;
        sync();
      } else if (inFullscreen()) {
        if (document.exitFullscreen) await document.exitFullscreen();
        else document.webkitExitFullscreen();
      } else if (viewer.requestFullscreen) await viewer.requestFullscreen();
      else if (viewer.webkitRequestFullscreen) viewer.webkitRequestFullscreen();
      else { windowImmersive = true; sync(); }
    } catch {
      windowImmersive = true;
      sync();
    }
  });
  for (const event of ['pointermove', 'pointerdown', 'keydown', 'focusin']) viewer.addEventListener(event, reveal);
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && windowImmersive) { windowImmersive = false; sync(); }
  });
  sync();
}

function showFallback() {
  canvas.hidden = true;
  byId('scene-tools').hidden = true;
  byId('transport').hidden = true;
  stage.classList.add('static-scene');
  status.hidden = false;
  status.textContent = 'Interactive 3D requires WebGL 2.';
}

function start() {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.08, 150);
  const controls = new OrbitControls(camera, canvas);
  controls.enablePan = false;
  controls.rotateSpeed = 0.6;
  controls.zoomSpeed = 0.8;
  controls.minDistance = 5.2;
  controls.maxDistance = 48;
  controls.minPolarAngle = 0.05;
  controls.maxPolarAngle = Math.PI - 0.05;

  const environment = createEnvironment(THREE, scene, renderer);
  const swarm = createSwarm(THREE, scene);
  const target = createTarget(THREE, scene);
  const buffer = new THREE.WebGLRenderTarget(1, 1, {
    type: THREE.HalfFloatType,
    samples: Math.min(4, renderer.capabilities.maxSamples),
  });
  const composer = new EffectComposer(renderer, buffer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.32, 0.48, 1.03));
  composer.addPass(new OutputPass());

  const presets = {
    wide: { position: [0, 1.2, 16], target: [0, 0, 0], shift: 0.15 },
    formation: { position: [-12.5, 6.6, 11.8], target: [-4.7, 0, -0.2], shift: 0.01 },
    close: { position: [2.3, 1.4, 10.7], target: [0, 0, 0], shift: 0.065 },
  };
  let currentView = 'wide';
  let shift = presets.wide.shift;
  let transition = null;
  let settingCamera = false;
  let dirty = true;
  let width = 1;
  let height = 1;
  let quality = 1;
  let baseRatio = 1;
  let time = 0;
  let playing = !reducedMotion.matches;
  let scrubbing = false;
  let previousFrame = null;
  let slowFrames = 0;
  let lastQualityCheck = 0;

  function project() {
    const aspect = width / height;
    const narrow = aspect < 1;
    const verticalSpan = Math.max(2 * Math.tan(THREE.MathUtils.degToRad(21)), 0.75 / aspect);
    camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(verticalSpan / 2));
    const offset = narrow ? Math.min(shift, 0.105) : shift;
    camera.setViewOffset(width, height, -width * offset, narrow ? -height * 0.025 : 0, width, height);
    camera.updateProjectionMatrix();
    dirty = true;
  }

  function setResolution() {
    const ratio = baseRatio * quality;
    renderer.setPixelRatio(ratio);
    renderer.setSize(width, height, false);
    composer.setPixelRatio(ratio);
    composer.setSize(width, height);
    dirty = true;
  }
  function resize() {
    width = Math.max(1, stage.clientWidth);
    height = Math.max(1, stage.clientHeight);
    baseRatio = Math.min(window.devicePixelRatio || 1, 1.65, Math.sqrt(2000000 / (width * height)));
    project();
    setResolution();
  }

  function syncView(name) {
    currentView = name;
    for (const button of views) {
      const active = button.dataset.view === name;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    }
  }
  function moveCamera(position, center, horizontalShift) {
    settingCamera = true;
    camera.position.copy(position);
    controls.target.copy(center);
    shift = horizontalShift;
    project();
    controls.update();
    settingCamera = false;
    dirty = true;
  }
  function chooseView(name, immediate = false) {
    const preset = presets[name];
    const position = new THREE.Vector3(...preset.position);
    const center = new THREE.Vector3(...preset.target);
    syncView(name);
    if (immediate || reducedMotion.matches) {
      transition = null;
      moveCamera(position, center, preset.shift);
      return;
    }
    const startOrbit = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
    const endOrbit = new THREE.Spherical().setFromVector3(position.sub(center));
    const turn = THREE.MathUtils.euclideanModulo(endOrbit.theta - startOrbit.theta + Math.PI, Math.PI * 2) - Math.PI;
    endOrbit.theta = startOrbit.theta + turn;
    transition = { startOrbit, endOrbit, fromCenter: controls.target.clone(), center, fromShift: shift, shift: preset.shift, start: performance.now() };
  }
  function animateCamera(now) {
    if (!transition) return;
    const t = Math.min(1, (now - transition.start) / 750);
    const ease = t * t * (3 - 2 * t);
    const { startOrbit: a, endOrbit: b, fromCenter, center, fromShift, shift: endShift } = transition;
    const orbit = new THREE.Spherical(
      THREE.MathUtils.lerp(a.radius, b.radius, ease),
      THREE.MathUtils.lerp(a.phi, b.phi, ease),
      THREE.MathUtils.lerp(a.theta, b.theta, ease),
    );
    const pivot = fromCenter.clone().lerp(center, ease);
    const position = new THREE.Vector3().setFromSpherical(orbit).add(pivot);
    moveCamera(position, pivot, THREE.MathUtils.lerp(fromShift, endShift, ease));
    if (t === 1) transition = null;
  }
  for (const button of views) button.addEventListener('click', () => chooseView(button.dataset.view));
  controls.addEventListener('start', () => { transition = null; });
  controls.addEventListener('change', () => {
    if (!settingCamera && currentView) syncView(null);
    dirty = true;
  });
  canvas.addEventListener('keydown', (event) => {
    const orbit = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
    switch (event.key) {
      case 'ArrowLeft': orbit.theta -= 0.12; break;
      case 'ArrowRight': orbit.theta += 0.12; break;
      case 'ArrowUp': orbit.phi = Math.max(controls.minPolarAngle, orbit.phi - 0.12); break;
      case 'ArrowDown': orbit.phi = Math.min(controls.maxPolarAngle, orbit.phi + 0.12); break;
      case '+': case '=': orbit.radius = Math.max(controls.minDistance, orbit.radius * 0.9); break;
      case '-': case '_': orbit.radius = Math.min(controls.maxDistance, orbit.radius / 0.9); break;
      default: return;
    }
    event.preventDefault();
    transition = null;
    camera.position.setFromSpherical(orbit).add(controls.target);
    controls.update();
  });

  function syncPlayback() {
    const label = playing ? 'Pause' : 'Play';
    play.setAttribute('aria-label', label);
    play.title = label;
    play.classList.toggle('is-paused', !playing);
    byId('play-path').setAttribute('d', playing ? 'M8.5 5.5v13m7-13v13' : 'M7 4.5 19 12 7 19.5Z');
  }
  function syncTimeline() {
    const seconds = Math.floor(time);
    byId('elapsed').textContent = `00:${String(seconds).padStart(2, '0')}`;
    timeline.value = String(time);
    timeline.style.setProperty('--progress', `${100 * time / duration}%`);
    timeline.setAttribute('aria-valuetext', `${seconds} seconds`);
  }
  function togglePlayback() {
    playing = !playing;
    previousFrame = null;
    syncPlayback();
  }
  function seek(value) {
    time = Math.max(0, Math.min(duration, value));
    dirty = true;
    previousFrame = null;
    syncTimeline();
  }
  play.addEventListener('click', togglePlayback);
  document.addEventListener('keydown', (event) => {
    if (event.code === 'Space' && (event.target === canvas || event.target === document.body)) {
      event.preventDefault();
      togglePlayback();
    }
  });
  timeline.addEventListener('pointerdown', (event) => {
    scrubbing = true;
    timeline.setPointerCapture(event.pointerId);
  });
  function finishScrub() { scrubbing = false; previousFrame = null; }
  timeline.addEventListener('lostpointercapture', finishScrub);
  timeline.addEventListener('input', () => seek(Number(timeline.value)));
  timeline.addEventListener('keydown', (event) => {
    const step = event.shiftKey ? 5 : 0.5;
    if (['ArrowLeft', 'ArrowDown', 'ArrowRight', 'ArrowUp'].includes(event.key)) {
      event.preventDefault();
      seek(time + (['ArrowLeft', 'ArrowDown'].includes(event.key) ? -step : step));
    }
  });
  reducedMotion.addEventListener('change', (event) => {
    if (event.matches) { playing = false; syncPlayback(); }
  });
  document.addEventListener('visibilitychange', () => { previousFrame = null; });
  canvas.addEventListener('webglcontextlost', (event) => {
    event.preventDefault();
    renderer.setAnimationLoop(null);
    showFallback();
  });
  canvas.addEventListener('webglcontextrestored', () => window.location.reload());

  resize();
  new ResizeObserver(resize).observe(stage);
  chooseView('wide', true);
  syncPlayback();
  syncTimeline();
  let firstFrame = true;
  function draw(now) {
    if (document.hidden) return;
    const delta = previousFrame === null ? 0 : (now - previousFrame) / 1000;
    previousFrame = now;
    if (playing && !scrubbing && delta > 0) {
      time = (time + delta * Number(speed.value)) % duration;
      syncTimeline();
      dirty = true;
      if (delta > 0.045) slowFrames++;
      else slowFrames = Math.max(0, slowFrames - 1);
      if (slowFrames > 18 && now - lastQualityCheck > 2400 && quality > 0.55) {
        quality = Math.max(0.55, quality * 0.8);
        lastQualityCheck = now;
        slowFrames = 0;
        setResolution();
      }
    }
    animateCamera(now);
    if (!dirty) return;
    environment.update(time);
    const impacts = swarm.update(time);
    target.update(time, impacts);
    composer.render();
    dirty = false;
    if (firstFrame) {
      firstFrame = false;
      status.hidden = true;
      previousFrame = null;
    }
  }
  renderer.setAnimationLoop(draw);
}

setupFullscreen();
try { start(); }
catch (error) {
  console.error('Unable to load 3D scene', error);
  showFallback();
}
</script>
</body>
</html>
